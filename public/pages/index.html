<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrighters Fate — Início</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/home.css">
</head>

<body>

    <!-- NAVBAR (componente) -->
    <div id="navbar"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="overlay">
            <h3>WRIGHTERS FATE: SNAKE, CATS E SPICE</h3>
            <h1>O PALADAR DO MUNDO</h1>
            <button class="btn-hero">Visite nosso restaurante</button>
        </div>
    </section>

    <!-- HORÁRIO -->
    <section class="horario">
        <h2>HORÁRIO DE ATENDIMENTO</h2>
        <p><strong>Segunda à Sexta:</strong> 06h às 21h</p>
        <p><strong>Sábado e Domingo:</strong> 07h30 às 22h30</p>
        <p><strong>Fechado nos feriados</strong></p>
    </section>

    <!-- MAIS PEDIDOS -->
    <section class="pedidos">
        <div class="topo">
            <h2>MAIS PEDIDOS</h2>
            <button class="btn-cardapio">Ver Cardápio Completo</button>
        </div>
        <div class="cards">
            <div class="card">
                <img src="https://i.pinimg.com/1200x/fa/06/2c/fa062c05f5e6b974df57f845820616f4.jpg" alt="Lanche da manhã">
                <p>Café da manhã a portugal</p>
            </div>
            <div class="card">
                <img src="https://i.pinimg.com/736x/04/5d/2e/045d2eef7eface8fe04328dd76c16d7e.jpg" alt="Almoço">
                <p>Almoço de portugal</p>
            </div>
            <div class="card">
                <img src="https://i.pinimg.com/1200x/ce/cc/45/cecc45dc69b848b393fac059bf39e2e8.jpg" alt="Jantar">
                <p>Jantar a portugal</p>
            </div>
        </div>
    </section>

    <!-- FOOTER (componente) -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script>
        // Carregar componentes
        fetch("../components/navbar.html").then(r => r.text()).then(html => {
            document.getElementById("navbar").innerHTML = html;
            const toggle = document.getElementById("menuToggle");
            const links = document.getElementById("navLinks");
            toggle?.addEventListener("click", () => links.classList.toggle("active"));
        });
        fetch("../components/footer.html").then(r => r.text()).then(html => {
            document.getElementById("footer").innerHTML = html;
        });
    </script>
    <script src="../assets/js/home.js"></script>

</body>

</html>
