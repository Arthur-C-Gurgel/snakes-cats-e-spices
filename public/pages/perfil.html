<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil — Wrighters Fate</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

    <!-- NAVBAR (componente) -->
    <div id="navbar"></div>

    <!-- CONTEÚDO -->
    <section class="auth-page">
        <div class="auth-container" id="perfil-container">
            <h2>Meu Perfil</h2>

            <div class="auth-message" id="authMessage"></div>

            <div id="perfil-info" style="text-align:center; padding:20px 0; color:#888;">
                Carregando...
            </div>

            <form id="form-perfil" style="display:none;">
                <label for="perfil-nome">Nome</label>
                <input type="text" name="nome" id="perfil-nome" required>

                <label for="perfil-email">E-mail</label>
                <input type="email" name="email" id="perfil-email" required>

                <button type="submit" class="btn-auth">Salvar Alterações</button>
            </form>

            <div id="perfil-actions" style="display:none; text-align:center; margin-top:20px;">
                <button class="btn-auth" style="background:#e74c3c;" id="btn-logout">Sair da Conta</button>
            </div>
        </div>
    </section>

    <!-- FOOTER (componente) -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script>
        fetch("../components/navbar.html").then(r => r.text()).then(html => {
            document.getElementById("navbar").innerHTML = html;
            const toggle = document.getElementById("menuToggle");
            const links = document.getElementById("navLinks");
            toggle?.addEventListener("click", () => links.classList.toggle("active"));
        });
        fetch("../components/footer.html").then(r => r.text()).then(html => {
            document.getElementById("footer").innerHTML = html;
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const perfilInfo = document.getElementById("perfil-info");
            const formPerfil = document.getElementById("form-perfil");
            const perfilActions = document.getElementById("perfil-actions");
            const mensagem = document.getElementById("authMessage");

            try {
                const res = await fetch("/auth/perfil");
                if (res.ok) {
                    const data = await res.json();
                    const usuario = data.usuario;

                    perfilInfo.innerHTML = `
                        <p style="font-size:1.1rem; color:#333;"><strong>${usuario.nome}</strong></p>
                        <p style="color:#777;">${usuario.email}</p>`;

                    document.getElementById("perfil-nome").value = usuario.nome;
                    document.getElementById("perfil-email").value = usuario.email;

                    formPerfil.style.display = "block";
                    perfilActions.style.display = "block";
                } else {
                    perfilInfo.innerHTML = `
                        <p style="font-size:1rem;">Você precisa estar logado para acessar esta página.</p>
                        <br>
                        <a href="/login" class="btn">Fazer Login</a>`;
                }
            } catch {
                perfilInfo.innerHTML = `
                    <p style="font-size:1rem;">Erro ao carregar perfil.</p>`;
            }

            // Formulário de atualização
            formPerfil.addEventListener("submit", async (e) => {
                e.preventDefault();
                const nome = document.getElementById("perfil-nome").value;
                const email = document.getElementById("perfil-email").value;

                try {
                    const res = await api.atualizarPerfil({ nome, email });
                    if (res.success) {
                        mensagem.textContent = "Perfil atualizado com sucesso!";
                        mensagem.className = "auth-message success";
                    } else {
                        mensagem.textContent = res.message || "Erro ao atualizar.";
                        mensagem.className = "auth-message error";
                    }
                } catch {
                    mensagem.textContent = "Erro ao conectar ao servidor.";
                    mensagem.className = "auth-message error";
                }
                mensagem.style.display = "block";
                setTimeout(() => mensagem.style.display = "none", 4000);
            });

            // Logout
            document.getElementById("btn-logout")?.addEventListener("click", async () => {
                await api.logout();
                window.location.href = "/login";
            });
        });
    </script>

</body>

</html>
