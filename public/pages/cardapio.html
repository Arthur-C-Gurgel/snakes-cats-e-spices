<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio — Wrighters Fate</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/cardapio.css">
</head>

<body>

    <!-- NAVBAR (componente) -->
    <div id="navbar"></div>

    <!-- CONTEÚDO -->
    <section class="cardapio-page">
        <h1>Cardápio</h1>

        <!-- Formulário de cadastro (visível para admin) -->
        <form class="form-prato" id="form-prato">
            <input type="text" name="nome" placeholder="Nome do prato" required>
            <input type="text" name="descricao" placeholder="Descrição" required>
            <input type="number" name="preco" placeholder="Preço (R$)" step="0.01" min="0" required>
            <button type="submit">Cadastrar</button>
        </form>

        <!-- Grid de pratos (cards visuais) -->
        <div class="cardapio-grid" id="grid-pratos"></div>
    </section>

    <!-- FOOTER (componente) -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script>
        fetch("../components/navbar.html").then(r => r.text()).then(html => {
            document.getElementById("navbar").innerHTML = html;
            const toggle = document.getElementById("menuToggle");
            const links = document.getElementById("navLinks");
            toggle?.addEventListener("click", () => links.classList.toggle("active"));
        });
        fetch("../components/footer.html").then(r => r.text()).then(html => {
            document.getElementById("footer").innerHTML = html;
        });
    </script>
    <script src="../assets/js/cardapio.js"></script>

</body>

</html>
