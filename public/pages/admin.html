<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração — Wrighters Fate</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body>

    <!-- NAVBAR (componente) -->
    <div id="navbar"></div>

    <!-- CONTEÚDO -->
    <section class="admin-page">
        <h1>Painel Administrativo</h1>

        <div class="admin-layout">
            <!-- Sidebar -->
            <aside class="admin-sidebar">
                <nav>
                    <a href="#" class="active" data-section="resumo">Resumo</a>
                    <a href="#" data-section="pratos">Pratos</a>
                    <a href="#" data-section="pedidos">Pedidos</a>
                    <a href="#" data-section="usuarios">Usuários</a>
                </nav>
            </aside>

            <!-- Conteúdo -->
            <div class="admin-content">

                <!-- Resumo -->
                <div class="admin-section" data-section="resumo">
                    <div class="card">
                        <h2>Resumo</h2>
                        <p><strong>Pratos cadastrados:</strong> <span id="contador-pratos">0</span></p>
                        <p><strong>Pedidos pendentes:</strong> <span id="contador-pedidos">0</span></p>
                    </div>
                </div>

                <!-- Pratos -->
                <div class="admin-section" data-section="pratos" style="display:none;">
                    <div class="card">
                        <h2>Cadastrar Prato</h2>
                        <form class="admin-form" id="form-prato-admin">
                            <input type="text" name="nome" placeholder="Nome do prato" required>
                            <input type="text" name="descricao" placeholder="Descrição" required>
                            <input type="number" name="preco" placeholder="Preço (R$)" step="0.01" min="0" required>
                            <button type="submit">Cadastrar</button>
                        </form>
                    </div>

                    <div class="card">
                        <h2>Pratos Cadastrados</h2>
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Preço</th>
                                    <th>Descrição</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-pratos-admin"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Pedidos -->
                <div class="admin-section" data-section="pedidos" style="display:none;">
                    <div class="card">
                        <h2>Pedidos</h2>
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Status</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-pedidos-admin"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Usuários -->
                <div class="admin-section" data-section="usuarios" style="display:none;">
                    <div class="card">
                        <h2>Usuários</h2>
                        <p style="color:#888;">Gerenciamento de usuários em desenvolvimento.</p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER (componente) -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script>
        fetch("../components/navbar.html").then(r => r.text()).then(html => {
            document.getElementById("navbar").innerHTML = html;
            const toggle = document.getElementById("menuToggle");
            const links = document.getElementById("navLinks");
            toggle?.addEventListener("click", () => links.classList.toggle("active"));
        });
        fetch("../components/footer.html").then(r => r.text()).then(html => {
            document.getElementById("footer").innerHTML = html;
        });
    </script>
    <script src="../assets/js/admin.js"></script>

</body>

</html>
